async function parse(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let it=[];

async function impC(fl){if(me.role!=='admin')return;const f=fl[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer()),
 A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>String(r[1]).includes('@')),L=$('#cl');L.innerHTML='جاري الإضافة... (ما تقفلش الصفحة)';
 const c2=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let ok=0;
 for(const r of A){const n=String(r[0]).trim(),e=String(r[1]).trim().toLowerCase(),p=String(r[2]).trim();let msg='';
  if(!n||p.length<6)msg='❌ اسم المركز ناقص أو الباسورد أقل من 6';
  else for(let t=0;t<5;t++){const x=await c2.auth.signUp({email:e,password:p,options:{data:{center_name:n}}});
   if(x.error&&/rate|seconds|too many/i.test(x.error.message)){msg='⏳ الخادم طلب انتظار';await wait(30000);continue}
   if(x.error){msg=/already/i.test(x.error.message)?'⚠ الإيميل موجود قبل كده':'❌ '+x.error.message;break}
   const u=await sb.from('profiles').update({approved:true}).eq('id',x.data.user.id);msg=u.error?'❌ '+u.error.message:'✅ تمت الإضافة';if(!u.error)ok++;break}
  L.innerHTML+=`<div>${esc(n)} — ${esc(e)}: ${msg}</div>`;await wait(400)}
 L.innerHTML+=`<b>خلص: اتضاف ${ok} من ${A.length}</b>`;await load()}
function expX(){if(me.role!=='admin')return;const fe=x=>x?new Date(x).toLocaleString('en-GB',{hour12:false}).replace(',',''):'';
 const R=filt().map(o=>({'أمر التشغيل':o.swo,'رقم الطلب':o.svr,'نوع الطلب':o.order_type,'الموعد':fe(o.visit_at),'متأخر':late(o)?'نعم':'لا','العميل':o.customer_name,'كود العميل':o.customer_code,'موبايل':o.phone1,'موبايل 2':o.phone2,'العنوان':o.address,'المنتج':o.product,'المسافة (م)':o.distance_m,'المركز':o.center_name,'الفني':o.tech_name,'الحالة':o.status,'سبب الاستكمال':o.reason,'قطع الغيار':parts.filter(p=>p.order_id===o.id).map(p=>'زيارة '+p.visit_no+': '+p.part_name+(p.part_code?' ('+p.part_code+')':'')+' ×'+p.qty).join(' | '),'التقرير الفني':o.tech_report,'تاريخ الرفع':fe(o.created_at)}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R),'البلاغات');wb.Workbook={Views:[{RTL:true}]};
 XLSX.writeFile(wb,'orders-'+new Date().toISOString().slice(0,10)+'.xlsx')}
/* ---- v2: تعديل / تأجيل / سجل / إحصائيات / باسورد ---- */
const POST=o=>o.status==='تم الانتهاء'?'':`<div class="card"><b>تأجيل الموعد</b><p><input type="datetime-local" id="nd"> <input id="nr" placeholder="سبب التأجيل (إجباري)"> <button onclick="postp('${o.id}')">تأجيل</button> <span id="pm" class="red"></span></p></div>`;
const EDIT=o=>`<div class="card"><b>تعديل البيانات (أدمن)</b><div class="g">${F.map(([k,l,ty])=>`<div><label>${l}</label><input data-e="${k}" type="${ty||'text'}" value="${esc(ty?tl(o[k]):o[k])}"></div>`).join('')}</div><p><button class="p" onclick="editO('${o.id}')">حفظ التعديلات</button> <button onclick="delO('${o.id}')" style="color:#d93025">حذف البلاغ</button> <span id="em" class="red"></span></p></div>`;
const LOG=l=>`<div class="card"><b>سجل التغييرات</b>${(l||[]).map(x=>`<div style="font-size:13px;margin-top:4px">${fd(x.at)} · ${esc(x.by_email)} · <b>${esc(x.action)}</b> ${esc(x.detail)}</div>`).join('')||'<p>—</p>'}</div>`;
async function postp(id){const v=$('#nd').value,r=$('#nr').value.trim();if(!v||!r)return $('#pm').textContent='اختار الموعد الجديد واكتب السبب';
 const{error}=await sb.from('orders').update({visit_at:new Date(v).toISOString(),postpone_reason:r}).eq('id',id);if(error)return $('#pm').textContent=error.message;await load();$('#m').style.display='none';go('list')}
async function editO(id){if(me.role!=='admin')return;const o={};document.querySelectorAll('[data-e]').forEach(e=>o[e.dataset.e]=e.value.trim());
 o.center_norm=norm(o.center_name);const cur=orders.find(x=>x.id===id);if(cur&&cur.center_norm!==o.center_norm){o.tech_id=null;o.tech_name=null}o.visit_at=o.visit_at?new Date(o.visit_at).toISOString():null;o.distance_m=o.distance_m?+o.distance_m:null;
 const{error}=await sb.from('orders').update(o).eq('id',id);if(error)return $('#em').textContent=error.message;await load();openO(id)}
async function delO(id){if(me.role!=='admin'||!confirm('متأكد من حذف البلاغ نهائياً؟'))return;const{error}=await sb.from('orders').delete().eq('id',id);if(error)return alert(error.message);$('#m').style.display='none';await load();go('list')}
async function vStats(){$('#v').innerHTML='جاري الحساب...';
 const{data:lg}=await sb.from('order_log').select('order_id,at').eq('action','تغيير الحالة').like('detail','%← تم الانتهاء'),done={};(lg||[]).forEach(x=>done[x.order_id]=x.at);const by={};
 orders.forEach(o=>{const k=o.center_norm||'—',b=by[k]=by[k]||{c:o.center_name||'—',t:0,n:0,d:0,u:0,l:0,w:0,p:0,s:0,k:0};b.t++;
  if(o.status==='تم الانتهاء'){b.d++;if(done[o.id]){b.s+=(new Date(done[o.id])-new Date(o.created_at))/864e5;b.k++}}else if(o.status==='له استكمال')b.u++;else b.n++;
  if(late(o))b.l++;if(soon(o))b.w++;if(o.visit_orig)b.p++});
 const R=Object.values(by).sort((a,b)=>b.l-a.l||b.t-a.t),T=k=>R.reduce((a,b)=>a+b[k],0);
 $('#v').innerHTML=`<div class="card"><b>الإجمالي:</b> ${T('t')} بلاغ · جديد ${T('n')} · منتهي ${T('d')} · له استكمال ${T('u')} · <span class="red">متأخر ${T('l')}</span> · قريب ${T('w')} · مؤجل ${T('p')}</div>
<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:center"><tr><th>المركز</th><th>الكل</th><th>جديد</th><th>منتهي</th><th>له استكمال</th><th>متأخر</th><th>قريب</th><th>مؤجل</th><th>متوسط الإنجاز (يوم)</th></tr>${R.map(b=>`<tr style="border-top:1px solid var(--b)${b.l?';background:var(--r)':''}"><td>${esc(b.c)}</td><td>${b.t}</td><td>${b.n}</td><td>${b.d}</td><td>${b.u}</td><td>${b.l}</td><td>${b.w}</td><td>${b.p}</td><td>${b.k?(b.s/b.k).toFixed(1):'-'}</td></tr>`).join('')}</table></div>`}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(chPw,600)});
async function chPw(){const p=prompt('اكتب الباسورد الجديد (6 حروف على الأقل):');if(!p)return;if(p.length<6)return alert('الباسورد أقل من 6 حروف');const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:'تم تغيير الباسورد ✅')}
async function forgot(){const e=$('#e').value.trim();if(!e)return $('#er').textContent='اكتب الإيميل في الخانة الأول';const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});$('#er').textContent=error?error.message:'اتبعت رابط تغيير الباسورد على الإيميل'}
/* ---- قطع الغيار ---- */
async function addParts(oid,v,t){const A=String(t||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(r=>r[0]).map(r=>({order_id:oid,visit_no:v,part_name:r[0],part_code:r[1]||'',qty:+r[2]||1}));if(A.length)return sb.from('order_parts').insert(A)}
const PARTS=(o,ad)=>{const L=parts.filter(p=>p.order_id===o.id).sort((a,b)=>a.visit_no-b.visit_no);if(!L.length&&!ad)return'';
 return `<div class="card"><b>🔧 قطع الغيار</b>${L.map(p=>`<div style="margin-top:4px">زيارة ${p.visit_no}: ${esc(p.part_name)}${p.part_code?' ('+esc(p.part_code)+')':''} × ${p.qty}${ad?` <button onclick="delP('${p.id}','${o.id}')">✕</button>`:''}</div>`).join('')||'<p>لا يوجد.</p>'}
 ${ad?`<p><select id="pv">${[1,2,3,4,5].map(n=>`<option value="${n}">زيارة ${n}</option>`).join('')}</select> <input id="pn" placeholder="اسم القطعة"> <input id="pc" placeholder="الكود (اختياري)" size="10"> <input id="pq" type="number" min="1" value="1" style="width:70px"> <button class="p" onclick="addP('${o.id}')">إضافة</button></p>`:''}</div>`};
async function addP(oid){if(me.role!=='admin')return;const n=$('#pn').value.trim();if(!n)return;
 const{error}=await sb.from('order_parts').insert({order_id:oid,visit_no:+$('#pv').value,part_name:n,part_code:$('#pc').value.trim(),qty:+$('#pq').value||1});if(error)return alert(error.message);await load();openO(oid)}
async function delP(id,oid){if(me.role!=='admin')return;await sb.from('order_parts').delete().eq('id',id);await load();openO(oid)}
/* ---- فنيين المراكز ---- */
let TC=[];
const techCard=()=>{const m={};profiles.filter(p=>p.approved&&p.role!=='admin').forEach(p=>m[p.center_norm]=p.center_name);
 orders.forEach(o=>{if(o.center_norm&&!m[o.center_norm])m[o.center_norm]=o.center_name});techs.forEach(t=>{if(!m[t.center_norm])m[t.center_norm]=t.center_name});
 TC=Object.entries(m).sort((a,b)=>a[1].localeCompare(b[1],'ar'));
 return `<div class="card"><b>👷 فنيين المراكز</b><p>الأعمدة بالترتيب: اسم المركز | اسم الفني | الموبايل (اختياري)</p><button onclick="tplT()">تنزيل نموذج</button> <input type="file" accept=".xlsx,.xls,.csv" onchange="impT(this.files)"> <span id="tl"></span>
 <p><select id="tc">${TC.map(([n,c],i)=>`<option value="${i}">${esc(c)}</option>`).join('')}</select> <input id="tn" placeholder="اسم الفني"> <input id="tp" placeholder="الموبايل (اختياري)" size="12"> <button class="p" onclick="addT()">إضافة فني</button></p>
 ${TC.map(([n,c])=>{const L=techs.filter(t=>t.center_norm===n);return L.length?`<div style="margin-top:6px"><b>${esc(c)}</b>: ${L.map(t=>esc(t.name)+(t.phone?' ('+esc(t.phone)+')':'')+` <button onclick="delT('${t.id}')">✕</button>`).join(' · ')}</div>`:''}).join('')}</div>`};
function tplT(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['اسم المركز','اسم الفني','الموبايل'],['مركز المثال','أحمد علي','01000000000']]),'الفنيين');XLSX.writeFile(wb,'technicians-template.xlsx')}
async function impT(fl){if(me.role!=='admin')return;const f=fl[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer()),
 R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>String(r[0]).trim()&&String(r[1]).trim()&&String(r[0]).trim()!=='اسم المركز'),
 seen=new Set(techs.map(t=>t.center_norm+'|'+norm(t.name))),A=[];
 R.forEach(r=>{const c=String(r[0]).trim(),n=String(r[1]).trim(),k=norm(c)+'|'+norm(n);if(seen.has(k))return;seen.add(k);A.push({center_name:c,center_norm:norm(c),name:n,phone:String(r[2]).trim()})});
 if(!A.length)return $('#tl').textContent='مفيش فنيين جدد في الشيت';
 const{error}=await sb.from('technicians').insert(A);if(error)return $('#tl').textContent=error.message;await load();vCn();$('#tl').textContent='✅ اتضاف '+A.length+' فني'}
async function addT(){if(me.role!=='admin')return;const n=$('#tn').value.trim();if(!n||!TC.length)return;const[cn,c]=TC[$('#tc').value];
 const{error}=await sb.from('technicians').insert({center_name:c,center_norm:cn,name:n,phone:$('#tp').value.trim()});if(error)return alert(error.message);await load();vCn()}
async function delT(id){if(me.role!=='admin'||!confirm('حذف الفني؟'))return;await sb.from('technicians').delete().eq('id',id);await load();vCn()}
const TECH=o=>{const L=techs.filter(t=>t.center_norm===o.center_norm);return `<div class="card"><b>👷 الفني</b> <select id="tsel"><option value="">— بدون —</option>${L.map(t=>`<option value="${t.id}" ${t.id===o.tech_id?'selected':''}>${esc(t.name)}</option>`).join('')}</select> <button onclick="setT('${o.id}')">حفظ</button> ${L.length?'':'<span class="warn">لا يوجد فنيين مسجلين لهذا المركز</span>'}</div>`};
async function setT(id){if(me.role!=='admin')return;const v=$('#tsel').value,t=techs.find(x=>x.id===v);
 const{error}=await sb.from('orders').update({tech_id:v||null,tech_name:t?t.name:null}).eq('id',id);if(error)return alert(error.message);await load();openO(id)}
init();
</script></body></html>
